# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Mobility
subtitle: 聚沙成塔，让每一步都有选择
description: 聚焦后端开发与架构设计，分享 Java、消息队列、数据库、云原生、大数据、AI/LLM 等技术实践与个人成长
author: 流沙
language: zh-CN
timezone:

i18n:
  type: [page, post]
  generator: [archive, category, tag, index]


# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://lichuanyang.top/
root: /
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: ['*.html', demo/**, test/*, ip/**]

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
# external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:
  
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
# plugins:
#  - hexo-generator-robotstxt

## Themes: https://hexo.io/themes/
theme: butterfly
feed:
  type: atom
  path: atom.xml
  limit: 0
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
sitemap:
  path: sitemap.xml
  template: ./sitemap_template.xml
baidusitemap:
    path: baidusitemap.xml


# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
- type: git
  repo: 
     github: git@github.com:lcy362/lcy362.github.io.git
#     coding: git@git.coding.net:lcy362/lcy362.git
  branch: master
  name: lcy362
  email: lcy362@163.com
  
- type: baidu_url_submitter

search:
  path: search.xml
  field: post
  format: html
  limit: 10000

robotstxt:
  useragent: "*"
  sitemap: https://lichuanyang.top/sitemap.xml

baidu_url_submit:
  count: 4 ## 提交最新的一个链接
  host: lichuanyang.top ## 在百度站长平台中注册的域名
  token:  KtMATfM90O7cVtzX ## 请注意这是您的秘钥， 所以请不要把博客源代码发布在公众仓库里!
path: baidu_urls.txt ## 文本文档的地址， 新链接会保存在此文本文档里

# hexo-filter-optimize
filter_optimize:
  enable: true
  remove_comments: false
  css:
    bundle: false
    delivery: false
    inlines:
    excludes:
  js:
    bundle: true
    excludes:
  priority: 12


